<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নূর | ইসলামিক গ্যালারি</title>
    <link rel="stylesheet" href="style.css">
    <!-- গুগল ফন্ট -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- হেডার সেকশন -->
    <header>
        <div class="logo">
            <h1>نور</h1>
            <span>Islamic Gallery</span>
        </div>
        <nav>
            <a href="#home" class="active">হোম</a>
            <a href="#gallery">গ্যালারি</a>
            <a href="#videos">ভিডিও</a>
        </nav>
    </header>

    <!-- হিরো সেকশন -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h2>শান্তি ও সৌন্দর্যের সন্ধানে</h2>
            <p>ইসলামিক স্থাপত্য, ক্যালিগ্রাফি এবং প্রকৃতির প্রশান্তিময় মুহূর্তের এক ডিজিটাল সংগ্রহ।</p>
            <a href="#gallery" class="btn">গ্যালারি দেখুন</a>
        </div>
    </section>

    <!-- গ্যালারি সেকশন -->
    <section id="gallery" class="section">
        <div class="section-title">
            <h3>ছবির সংগ্রহ</h3>
            <div class="underline"></div>
        </div>
        
        <!-- এখানে জাভাস্ক্রিপ্ট ছবি লোড করবে -->
        <div class="gallery-grid" id="photo-gallery">
            <!-- ছবি এখানে আসবে -->
        </div>
        
        <div class="load-more">
            <button id="load-more-btn" class="btn-outline">আরও লোড করুন</button>
        </div>
    </section>

    <!-- ভিডিও সেকশন -->
    <section id="videos" class="section bg-alt">
        <div class="section-title">
            <h3>ভিডিও সংগ্রহ</h3>
            <div class="underline"></div>
        </div>
        
        <!-- এখানে জাভাস্ক্রিপ্ট ভিডিও লোড করবে -->
        <div class="video-grid" id="video-gallery">
            <!-- ভিডিও এখানে আসবে -->
        </div>
        
        <div class="load-more">
            <button id="load-more-video-btn" class="btn-outline">আরও ভিডিও</button>
        </div>
    </section>

    <!-- ফুটার -->
    <footer>
        <p>ছবি ও ভিডিও: <a href="https://www.pexels.com" target="_blank">Pexels</a> (ফ্রি লাইসেন্স)</p>
        <p>&copy; 2026 নূর ইসলামিক গ্যালারি। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
