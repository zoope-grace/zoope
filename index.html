<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Gallery & Video</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">PREMIUM<span>GALLERY</span></div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Categories</a>
            <a href="#">Trending</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <!-- Hero Section (Background Image Added Here) -->
    <section class="hero">
        <div class="hero-content">
            <h1>Exclusive Collection</h1>
            <p>Browse through our premium curated sets from around the world.</p>
            <button class="btn-primary">Explore Now</button>
        </div>
    </section>

    <!-- Category Tabs -->
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" data-category="all">All Sets</button>
            <button class="tab-btn" data-category="japanese">Japanese</button>
            <button class="tab-btn" data-category="european">European</button>
            <button class="tab-btn" data-category="american">American</button>
            <button class="tab-btn" data-category="african">African</button>
            <button class="tab-btn" data-category="latina">Latina</button>
        </div>

        <!-- Image Grid -->
        <h2 class="section-title">Photo Sets</h2>
        <div id="image-grid" class="grid-container">
            <!-- Images will be injected here via JS -->
        </div>

        <!-- Video Section -->
        <h2 class="section-title" style="margin-top: 50px;">Latest Videos</h2>
        <div id="video-grid" class="grid-container">
            <!-- Videos will be injected here via JS -->
        </div>
    </div>

    <footer>
        <p>&copy; 2023 Premium Gallery. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
