<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Hot Gallery | Premium Access</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">HOT<span>JAPAN</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Premium</a></li>
            <li><a href="#">Login</a></li>
        </ul>
        <div class="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Explore Japanese Beauty</h1>
            <p>High Quality uncensored galleries from unphalash</p>
            <a href="#gallery" class="btn-main">View Gallery</a>
        </div>
    </header>

    <!-- Gallery Section -->
    <section id="gallery" class="gallery-container">
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="cute">Cute</button>
            <button class="filter-btn" data-filter="hot">Hot</button>
            <button class="filter-btn" data-filter="premium">Premium</button>
        </div>

        <div class="image-grid" id="imageGrid">
            <!-- Images will be loaded here via JS -->
            <div class="image-card" data-category="hot">
                <img src="https://via.placeholder.com/400x600" alt="Japanese Model">
                <div class="overlay">
                    <span class="badge">Hot</span>
                    <button class="view-btn">View Full Size</button>
                </div>
            </div>
            <!-- More cards will be added -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2023 HotJapan Site. All rights reserved.</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a> | <a href="#">Terms of Use</a>
        </div>
    </footer>

</body>
</html>
