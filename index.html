<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAV Hot - Premium Japanese Content</title>
    <style>
        /* CSS Reset & Variables */
        :root {
            --primary-color: #e50914; /* Netflix Red style */
            --bg-dark: #141414;
            --bg-card: #1f1f1f;
            --text-light: #ffffff;
            --text-gray: #b3b3b3;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-main);
            overflow-x: hidden;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            transition: background 0.3s;
        }

        header.scrolled {
            background-color: var(--bg-dark);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        .user-actions button {
            background: transparent;
            border: 1px solid var(--text-light);
            color: var(--text-light);
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .user-actions button:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            background: url('https://images.unsplash.com/photo-1542051841857-1a6385d87563?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 4%;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, rgba(20,20,20,0.9) 0%, transparent 100%);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-gray);
        }

        .btn-play {
            padding: 12px 30px;
            font-size: 1.2rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background-color: #f40612;
        }

        /* Video Grid Section */
        .container {
            padding: 20px 4%;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
        }

        .video-card:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .duration {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info span {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-top: 40px;
            border-top: 1px solid #333;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="navbar">
        <div class="logo">JAV<span style="color:white">HOT</span></div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Trending</a></li>
                <li><a href="#">New Release</a></li>
                <li><a href="#">Categories</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button>Login</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Top Pick of the Week</h1>
            <p>Experience the latest high-definition releases from Tokyo's hottest stars. Exclusive content available now.</p>
            <button class="btn-play" onclick="alert('Playing Video...')">▶ Play Now</button>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container">
        <h2 class="section-title">Trending Now</h2>
        <div class="video-grid" id="videoGrid">
            <!-- Videos will be injected here via JS -->
        </div>

        <h2 class="section-title" style="margin-top: 40px;">New Arrivals</h2>
        <div class="video-grid" id="newArrivalsGrid">
            <!-- More videos -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2023 JAVHOT Inc. All rights reserved. | Privacy Policy | Terms</p>
    </footer>

    <script>
        // Data Source: Using Unsplash images with Japanese aesthetic/themes
        const videoData = [
            {
                title: "Midnight in Shibuya",
                duration: "24:15",
                views: "1.2M",
                image: "https://images.unsplash.com/photo-1542051841857-1a6385d87563?q=80&w=400&auto=format&fit=crop"
            },
            {
                title: "Sakura Dreams",
                duration: "45:30",
                views: "890K",
                image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=400&auto=format&fit=crop"
            },
            {
                title: "Tokyo Drift Story",
                duration: "18:20",
                views: "2.5M",
                image: "https://images.unsplash.com/photo-1503899036085-c552c49cf72b?q=80&w=400&auto=format&fit=crop"
            },
            {
                title: "Neon Lights",
                duration: "32:10",
                views: "500K",
                image: "https://images.unsplash.com/photo-1540959733332-eab4deacfaf0?q=80&w=400&auto=format&fit=crop"
            },
            {
                title: "Quiet Garden",
                duration: "28:45",
                views: "1.1M",
                image: "https://images.unsplash.com/photo-1528360983277-13d9b152c6d1?q=80&w=400&auto=format&fit=crop"
            },
            {
                title: "Rainy Day Mood",
                duration: "15:00",
                views: "3.4M",
                image: "https://images.unsplash.com/photo-1515213016670-866df473663f?q=80&w=400&auto=format&fit=crop"
            },
             {
                title: "Urban Girl",
                duration: "22:10",
                views: "900K",
                image: "https://images.unsplash.com/photo-1485230405346-71acb9518d9c?q=80&w=400&auto=format&fit=crop"
            },
            {
                title: "Cosplay Night",
                duration: "40:00",
                views: "1.8M",
                image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=400&auto=format&fit=crop"
            }
        ];

        // Function to generate HTML for cards
        function createCard(video) {
            return `
                <div class="video-card">
                    <div class="thumbnail-container">
                        <img src="${video.image}" alt="${video.title}">
                        <span class="duration">${video.duration}</span>
                    </div>
                    <div class="card-info">
                        <h3>${video.title}</h3>
                        <span>${video.views} views • HD</span>
                    </div>
                </div>
            `;
        }

        // Populate grids
        const grid1 = document.getElementById('videoGrid');
        const grid2 = document.getElementById('newArrivalsGrid');

        // Add first 4 items to Trending
        videoData.slice(0, 4).forEach(video => {
            grid1.innerHTML += createCard(video);
        });

        // Add next 4 items to New Arrivals
        videoData.slice(4, 8).forEach(video => {
            grid2.innerHTML += createCard(video);
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
